name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Das Android-SDK ist auf ubuntu-latest vorinstalliert (ANDROID_HOME)

      - run: npm ci
      - run: npm test
      - name: Web-App bauen und in das Android-Projekt kopieren
        run: npm run android:sync

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/din5008-trainer.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: din5008-trainer-apk
          path: din5008-trainer.apk

      - name: Als Release zum Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: DIN 5008 Trainer – APK Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            Android-App zum direkten Installieren (Branch `${{ github.ref_name }}`, Commit ${{ github.sha }}).
            Auf dem Handy `din5008-trainer.apk` herunterladen und öffnen; ggf. „Installation aus unbekannten Quellen“ erlauben.
          files: din5008-trainer.apk
